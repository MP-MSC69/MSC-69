<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>MSC-69</title>
  <style>
    :root {
      /* ปรับค่านี้ (px) เพื่อดันเฟรมขึ้นไปตัดแบนเนอร์ของ Google Apps Script
         ถ้าแบนเนอร์ไม่แสดงอยู่แล้ว ให้ใช้ 0px */
      --banner-offset: 0px;
      --bg: #ffffff;
      --fg: #1f2937;
      --accent: #2563eb;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #111827; --fg: #e5e7eb; --accent: #60a5fa; }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", sans-serif;
      overscroll-behavior: none;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100dvh;
      overflow: hidden; /* ใช้ตัดส่วนบนของเฟรม (แบนเนอร์) */
    }

    #gas-frame {
      position: absolute;
      top: calc(var(--banner-offset) * -1);
      left: 0;
      width: 100%;
      height: calc(100% + var(--banner-offset));
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: var(--bg);
    }

    /* Loading screen */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: var(--bg);
      opacity: 1;
      transition: opacity .6s ease;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    #loader.hide { opacity: 0; pointer-events: none; }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(127, 127, 127, .25);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }
    .loader-title { font-size: 1.25rem; font-weight: 600; letter-spacing: .04em; }
    .loader-sub { font-size: .875rem; opacity: .7; }

    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
      #loader { transition-duration: .01s; }
    }
  </style>
</head>
<body>
  <div id="app">
    <iframe
      id="gas-frame"
      title="MSC-69"
      src="https://script.google.com/a/macros/nu.ac.th/s/AKfycby2VGa-A4e0YjjeyW9bXFF5KolkY-fovE_6WF_MLujrTzc3Ce33OkHUhOOO-9l2uplAxA/exec"
      allow="fullscreen"
      allowfullscreen
      scrolling="no"
      frameborder="0"
    ></iframe>
  </div>

  <div id="loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="loader-title">MSC-69</div>
    <div class="loader-sub">กำลังโหลด...</div>
  </div>

  <script>
    (function () {
      var frame = document.getElementById('gas-frame');
      var loader = document.getElementById('loader');
      var done = false;

      function hideLoader() {
        if (done) return;
        done = true;
        loader.classList.add('hide');
        setTimeout(function () { loader.style.display = 'none'; }, 700);
      }

      frame.addEventListener('load', hideLoader);
      // กันกรณี load event ไม่ทำงาน: ซ่อนอัตโนมัติหลัง 15 วินาที
      setTimeout(hideLoader, 15000);
    })();
  </script>
</body>
</html>
