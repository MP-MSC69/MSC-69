<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>MSC-69</title>

  <style>
    :root {
      /* ถ้ายังเห็นแบนเนอร์ของ Google ด้านบน ให้เปลี่ยนเป็น 40px */
      --banner-offset: 0px;
      --bg: #ffffff;
      --fg: #1f2937;
      --accent: #2563eb;
      --track: #e5e7eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --fg: #f3f4f6;
        --accent: #60a5fa;
        --track: #374151;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      overscroll-behavior: none;
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun", sans-serif;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    #frame {
      position: absolute;
      top: calc(var(--banner-offset) * -1);
      left: 0;
      width: 100%;
      height: calc(100dvh + var(--banner-offset));
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: var(--bg);
    }

    #loader {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--bg);
      color: var(--fg);
      padding: env(safe-area-inset-top) env(safe-area-inset-right)
               env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 1;
      visibility: visible;
      transition: opacity .6s ease, visibility .6s ease;
    }

    #loader.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid var(--track);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .9s linear infinite;
    }

    .title { font-size: 1.25rem; font-weight: 600; letter-spacing: .04em; }
    .sub { font-size: .9rem; opacity: .65; }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2s; }
      #loader { transition-duration: .01s; }
    }

    noscript {
      position: fixed;
      inset: 0;
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--fg);
      text-align: center;
      padding: 24px;
    }
  </style>
</head>
<body>

  <div id="loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="title">MSC-69</div>
    <div class="sub">กำลังโหลด...</div>
  </div>

  <main id="app">
    <iframe
      id="frame"
      title="MSC-69"
      src="https://script.google.com/a/macros/nu.ac.th/s/AKfycbwyA9FPZWUwcXX1bs3iHKwyemrCWcFdlz-QaCoxO-Tthpk56HmWSSkdy8zYeExBSi89_g/exec"
      allow="fullscreen; clipboard-read; clipboard-write; camera; microphone; geolocation"
      allowfullscreen
      frameborder="0"
      scrolling="no"
      referrerpolicy="strict-origin-when-cross-origin"
    ></iframe>
  </main>

  <noscript>กรุณาเปิดใช้งาน JavaScript เพื่อใช้งานเว็บแอปนี้</noscript>

  <script>
    (function () {
      var loader = document.getElementById('loader');
      var frame = document.getElementById('frame');
      var done = false;

      function hideLoader() {
        if (done) return;
        done = true;
        loader.classList.add('hide');
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 800);
      }

      frame.addEventListener('load', hideLoader);
      // กันค้าง: ซ่อน Loading อัตโนมัติหากโหลดนานเกิน 15 วินาที
      setTimeout(hideLoader, 15000);
    })();
  </script>
</body>
</html>
