<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>MSC-69</title>
  <style>
    /* ปรับค่านี้ให้ตรงกับความสูงแบนเนอร์ของ Google (ปกติประมาณ 40px)
       ถ้าแอปของคุณไม่มีแบนเนอร์ ให้ตั้งเป็น 0px */
    :root {
      --banner-offset: 40px;
      --bg: #ffffff;
      --fg: #1f2937;
      --accent: #2563eb;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #111827;
        --fg: #e5e7eb;
        --accent: #60a5fa;
      }
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      background: var(--bg);
      overscroll-behavior: none;
    }

    /* กรอบครอบ iframe: ตัดส่วนบนที่เป็นแบนเนอร์ทิ้ง */
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    #frame {
      position: absolute;
      top: calc(var(--banner-offset) * -1);
      left: 0;
      width: 100%;
      height: calc(100dvh + var(--banner-offset));
      border: 0;
      margin: 0;
      padding: 0;
      display: block;
      background: var(--bg);
    }

    /* Loading screen */
    #loader {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: var(--bg);
      color: var(--fg);
      font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Thai", "Sarabun", sans-serif;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      opacity: 1;
      transition: opacity 0.6s ease;
    }

    #loader.hide {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(37, 99, 235, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .hint {
      font-size: 0.9rem;
      opacity: 0.7;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (prefers-reduced-motion: reduce) {
      .spinner { animation-duration: 2.5s; }
      #loader { transition-duration: 0.01s; }
    }
  </style>
</head>
<body>

  <div id="loader" role="status" aria-live="polite">
    <div class="spinner" aria-hidden="true"></div>
    <div class="title">MSC-69</div>
    <div class="hint">กำลังโหลด...</div>
  </div>

  <div id="app">
    <iframe
      id="frame"
      title="MSC-69"
      src="https://script.google.com/a/macros/nu.ac.th/s/AKfycby3QPQDAPMfccgiiRIUwGhdjjPUtZdjbj6KBZItfsjT4ltBQeYNIGEQpORErYf3oHL5OQ/exec"
      allow="fullscreen"
      allowfullscreen
      scrolling="no"
      frameborder="0"
    ></iframe>
  </div>

  <script>
    (function () {
      var loader = document.getElementById('loader');
      var frame = document.getElementById('frame');
      var done = false;

      function hideLoader() {
        if (done) return;
        done = true;
        loader.classList.add('hide');
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 700);
      }

      frame.addEventListener('load', hideLoader);

      // กันกรณี load event ไม่ทำงาน: เอา loader ออกหลัง 15 วินาที
      setTimeout(hideLoader, 15000);
    })();
  </script>
</body>
</html>
